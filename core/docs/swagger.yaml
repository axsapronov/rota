            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Reload proxy pool
      tags:
      - proxies
  /proxies/test/{job_id}:
    get:
      description: Get status of an async proxy test job
      parameters:
      - description: Job ID
        in: path
        name: job_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Job status
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Proxy test job status
      tags:
      - proxies
  /proxies/test/bulk:
    post:
      consumes:
      - application/json
      description: Enqueue async health check for the given proxy IDs
      parameters:
      - description: Proxy IDs to test
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BulkTestProxyRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Job accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Health check queue is full
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Test selected proxies
      tags:
      - proxies
  /proxies/test/global:
    post:
      description: Enqueue async health check for orphan (pool-less) proxies
      produces:
      - application/json
      responses:
        "202":
          description: Job accepted
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Health check queue is full
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Test all orphan proxies
      tags:
      - proxies
  /proxies/test/idle:
    post:
      description: Enqueue async health check for orphan proxies with status idle
      produces:
      - application/json
      responses:
        "202":
          description: Job accepted
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Health check queue is full
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
