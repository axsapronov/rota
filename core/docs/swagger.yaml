basePath: /api/v1
definitions:
  checkstats.GlobalHealthCheckSnapshot:
    properties:
      enabled:
        type: boolean
      interval_minutes:
        type: integer
      is_running:
        type: boolean
      last_checked_proxies:
        type: integer
      last_duration_ms:
        type: integer
      last_error:
        type: string
      last_finished_at:
        type: string
      last_started_at:
        type: string
      last_status:
        $ref: '#/definitions/checkstats.GlobalHealthCheckStatus'
      next_run_at:
        type: string
    type: object
  checkstats.GlobalHealthCheckStatus:
    enum:
    - idle
    - ok
    - error
    type: string
    x-enum-varnames:
    - GlobalHealthCheckStatusIdle
    - GlobalHealthCheckStatusOK
    - GlobalHealthCheckStatusError
  checkstats.Snapshot:
    properties:
      checks_last_minute:
        type: integer
      processed_last_10m:
        type: integer
      queue_pending:
        type: integer
      success_percent_1m:
        type: number
    type: object
  handlers.CPUMetrics:
    properties:
      cores:
        type: integer
      percentage:
        type: number
    type: object
  handlers.DiskMetrics:
    properties:
      free:
        type: integer
      percentage:
        type: number
      total:
        type: integer
      used:
        type: integer
    type: object
  handlers.MemoryMetrics:
    properties:
      available:
        type: integer
      percentage:
        type: number
      total:
        type: integer
      used:
        type: integer
    type: object
  handlers.RuntimeMetrics:
    properties:
      gc_pause_count:
        type: integer
      goroutines:
        type: integer
      mem_alloc:
        type: integer
      mem_sys:
        type: integer
      threads:
        type: integer
    type: object
  handlers.SystemMetrics:
    properties:
      cpu:
        $ref: '#/definitions/handlers.CPUMetrics'
      disk:
        $ref: '#/definitions/handlers.DiskMetrics'
      global_health_check:
        $ref: '#/definitions/checkstats.GlobalHealthCheckSnapshot'
      health_check:
        $ref: '#/definitions/checkstats.Snapshot'
      memory:
        $ref: '#/definitions/handlers.MemoryMetrics'
      runtime:
        $ref: '#/definitions/handlers.RuntimeMetrics'
    type: object
  models.AuthenticationSettings:
    properties:
      enabled:
        description: Enable authentication for proxy requests
        type: boolean
      password:
        description: Password for proxy authentication (write-only)
        type: string
      username:
        description: Username for proxy authentication
        type: string
    type: object
  models.BulkCreateProxyRequest:
    properties:
      proxies:
        items:
          $ref: '#/definitions/models.CreateProxyRequest'
        minItems: 1
        type: array
    required:
    - proxies
    type: object
  models.BulkDeleteProxyRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  models.BulkTagProxyRequest:
    properties:
      add:
        items:
          type: string
        type: array
      ids:
        items:
          type: integer
        minItems: 1
        type: array
      remove:
        items:
          type: string
        type: array
    required:
    - ids
    type: object
  models.BulkTestProxyRequest:
    properties:
      proxy_ids:
        items:
          type: integer
        minItems: 1
        type: array
      workers:
        type: integer
    required:
    - proxy_ids
    type: object
  models.ChartDataPoint:
    properties:
      time:
        type: string
      value:
        type: integer
    type: object
  models.CreateProxyRequest:
    properties:
      address:
        type: string
      password:
        type: string
      protocol:
        enum:
        - http
        - https
        - socks4
        - socks4a
        - socks5
        type: string
      source_id:
        description: set internally when importing from a source
        type: integer
      tags:
        items:
          type: string
        type: array
      username:
        type: string
    required:
    - address
    - protocol
    type: object
  models.DashboardStats:
    properties:
      active_proxies:
        type: integer
      avg_response_time:
        type: integer
      avg_success_rate:
        type: number
      request_growth:
        type: number
      response_time_delta:
        type: integer
      success_rate_growth:
        type: number
      total_proxies:
        type: integer
      total_requests:
        type: integer
    type: object
  models.ErrorResponse:
    properties:
      details: {}
      error:
        type: string
    type: object
  models.GeoIPSettings:
    properties:
      auto_update:
        description: Enable automatic DB update on interval
        type: boolean
      last_updated_at:
        description: Timestamp of last successful update
        type: string
      maxmind_db_path:
        description: Path to local .mmdb file
        type: string
      maxmind_license_key:
        description: MaxMind license key for auto-download
        type: string
      maxmind_url:
        description: Custom download URL (optional)
        type: string
      provider:
        description: '"ip-api" or "maxmind"'
        type: string
      update_interval_hours:
        description: How often to update in hours (default 168 = 7 days)
        type: integer
    type: object
  models.GlobalHealthCheckSettings:
    properties:
      enabled:
        type: boolean
      interval_minutes:
        type: integer
    type: object
  models.HealthCheckSettings:
    properties:
      headers:
        items:
          type: string
        type: array
      idle_ttl_minutes:
        description: IdleTTLMinutes is the same TTL filter for idle-orphan sweeps.
        type: integer
      orphan_ttl_minutes:
        description: OrphanTTLMinutes excludes orphan proxies checked more recently
          than now()-TTL from periodic orphan sweeps (0 disables the filter).
        type: integer
      status:
        type: integer
      strict_tls:
        description: Enable real TLS certificate validation during health checks
        type: boolean
      timeout:
        type: integer
      url:
        type: string
      workers:
        type: integer
    type: object
  models.Log:
    properties:
      details:
        type: string
      id:
        type: integer
      level:
        type: string
      message:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      timestamp:
        type: string
    type: object
  models.LogListResponse:
    properties:
      logs:
        items:
          $ref: '#/definitions/models.Log'
        type: array
      pagination:
        $ref: '#/definitions/models.PaginationMeta'
    type: object
  models.LogRetentionSettings:
    properties:
      cleanup_interval_hours:
        description: How often to run cleanup (1, 6, 12, 24)
        type: integer
      compression_after_days:
        description: Compress logs older than X days (1, 3, 7, 14)
        type: integer
      enabled:
        description: Enable automatic log cleanup
        type: boolean
      retention_days:
        description: Days to keep logs (7, 15, 30, 60, 90)
        type: integer
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.UserInfoResponse'
    type: object
  models.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  models.Proxy:
    properties:
      address:
        type: string
      avg_response_time:
        type: integer
      city_name:
        type: string
      country_code:
        description: GeoIP fields
        type: string
      country_name:
        type: string
      created_at:
        type: string
      geo_updated_at:
        type: string
      id:
        type: integer
      isp:
        type: string
      last_check:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      protocol:
        type: string
      region_name:
        type: string
      requests:
        type: integer
      status:
        type: string
      tags:
        description: Tags
        items:
          type: string
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.ProxyCleanupSettings:
    properties:
      cleanup_interval_hours:
        description: How often to run cleanup
        type: integer
      enabled:
        description: Enable automatic dead proxy cleanup
        type: boolean
      max_failed_days:
        description: Remove proxies failed for more than N days
        type: integer
      min_success_rate:
        description: Remove proxies with success rate below X% (0 = disabled)
        type: number
    type: object
  models.ProxyListResponse:
    properties:
      pagination:
        $ref: '#/definitions/models.PaginationMeta'
      proxies:
        items:
          $ref: '#/definitions/models.ProxyWithStats'
        type: array
    type: object
  models.ProxyTestResult:
    properties:
      address:
        type: string
      error:
        type: string
      id:
        type: integer
      response_time:
        type: integer
      status:
        type: string
      tested_at:
        type: string
    type: object
  models.ProxyWithStats:
    properties:
      address:
        type: string
      avg_response_time:
        type: integer
      city_name:
        type: string
      country_code:
        description: GeoIP fields
        type: string
      country_name:
        type: string
      created_at:
        type: string
      id:
        type: integer
      isp:
        type: string
      last_check:
        type: string
      protocol:
        type: string
      region_name:
        type: string
      requests:
        type: integer
      status:
        type: string
      success_rate:
        type: number
      tags:
        description: Tags
        items:
          type: string
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.RateLimitSettings:
    properties:
      enabled:
        type: boolean
      interval:
        description: in seconds
        type: integer
      max_requests:
        type: integer
    type: object
  models.ResponseTimeChartData:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ChartDataPoint'
        type: array
    type: object
  models.RotationSettings:
    properties:
      allowed_protocols:
        description: '["http", "https", "socks4", "socks4a", "socks5"], empty means
          all'
        items:
          type: string
        type: array
      fallback:
        type: boolean
      fallback_max_retries:
        type: integer
      follow_redirect:
        type: boolean
      max_response_time:
        description: in milliseconds, 0 means no limit
        type: integer
      method:
        type: string
      min_success_rate:
        description: 0-100, 0 means no minimum
        type: number
      remove_unhealthy:
        type: boolean
      retries:
        type: integer
      time_based:
        $ref: '#/definitions/models.TimeBasedSettings'
      timeout:
        type: integer
    type: object
  models.Settings:
    properties:
      authentication:
        $ref: '#/definitions/models.AuthenticationSettings'
      geoip:
        $ref: '#/definitions/models.GeoIPSettings'
      global_health_check:
        $ref: '#/definitions/models.GlobalHealthCheckSettings'
      healthcheck:
        $ref: '#/definitions/models.HealthCheckSettings'
      log_retention:
        $ref: '#/definitions/models.LogRetentionSettings'
      proxy_cleanup:
        $ref: '#/definitions/models.ProxyCleanupSettings'
      rate_limit:
        $ref: '#/definitions/models.RateLimitSettings'
      rotation:
        $ref: '#/definitions/models.RotationSettings'
    type: object
  models.SuccessRateChartData:
    properties:
      data:
        items:
          $ref: '#/definitions/models.SuccessRateDataPoint'
        type: array
    type: object
  models.SuccessRateDataPoint:
    properties:
      failure:
        type: integer
      success:
        type: integer
      time:
        type: string
    type: object
  models.TimeBasedSettings:
    properties:
      interval:
        description: in seconds
        type: integer
    type: object
  models.UpdateProxyRequest:
    properties:
      address:
        type: string
      password:
        type: string
      protocol:
        enum:
        - http
        - https
        - socks4
        - socks4a
        - socks5
        type: string
      tags:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  models.UserInfoResponse:
    properties:
      username:
        type: string
    type: object
host: localhost:8001
info:
  contact:
    name: API Support
    url: https://github.com/alpkeskin/rota
  description: |-
    A high-performance proxy rotation server with health monitoring and intelligent routing
    Provides comprehensive API for managing proxy servers, monitoring their health,
    and configuring rotation strategies.
  license:
    name: LICENSE
    url: https://github.com/alpkeskin/rota/blob/main/LICENSE
  title: Rota Proxy API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and receive JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: User login
      tags:
      - auth
  /dashboard/charts/response-time:
    get:
      description: Get response time chart data for visualization
      parameters:
      - default: 4h
        description: Time interval (e.g., 4h, 24h)
        in: query
        name: interval
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chart data
          schema:
            $ref: '#/definitions/models.ResponseTimeChartData'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Response time chart
      tags:
      - dashboard
  /dashboard/charts/success-rate:
    get:
      description: Get success rate chart data for visualization
      parameters:
      - default: 4h
        description: Time interval (e.g., 4h, 24h)
        in: query
        name: interval
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chart data
          schema:
            $ref: '#/definitions/models.SuccessRateChartData'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Success rate chart
      tags:
      - dashboard
  /dashboard/stats:
    get:
      description: Get dashboard statistics including proxy and request metrics
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard statistics
          schema:
            $ref: '#/definitions/models.DashboardStats'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Dashboard statistics
      tags:
      - dashboard
  /database/health:
    get:
      description: Check database connection health
      produces:
      - application/json
      responses:
        "200":
          description: Database health information
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Database health
      tags:
      - health
  /database/stats:
    get:
      description: Get database connection pool statistics
      produces:
      - application/json
      responses:
        "200":
          description: Database pool statistics
          schema:
            additionalProperties: true
            type: object
      summary: Database statistics
      tags:
      - health
  /health:
    get:
      description: Check if the API server is running and healthy
      produces:
      - application/json
      responses:
        "200":
          description: Health status information
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /logs:
    get:
      description: Get paginated list of system logs with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 100
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by log level
        in: query
        name: level
        type: string
      - description: Search term
        in: query
        name: search
        type: string
      - description: Filter by source
        in: query
        name: source
        type: string
      - description: Start time (RFC3339)
        in: query
        name: start_time
        type: string
      - description: End time (RFC3339)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of logs
          schema:
            $ref: '#/definitions/models.LogListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List logs
      tags:
      - logs
  /logs/export:
    get:
      description: Export system logs in various formats (txt, json)
      parameters:
      - default: txt
        description: Export format (txt/json)
        in: query
        name: format
        type: string
      - description: Filter by log level
        in: query
        name: level
        type: string
      - description: Filter by source
        in: query
        name: source
        type: string
      - description: Start time (RFC3339)
        in: query
        name: start_time
        type: string
      - description: End time (RFC3339)
        in: query
        name: end_time
        type: string
      produces:
      - text/plain
      - application/json
      responses:
        "200":
          description: Exported file
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Export logs
      tags:
      - logs
  /metrics/system:
    get:
      description: Get current system resource metrics (CPU, memory, disk, runtime)
      produces:
      - application/json
      responses:
        "200":
          description: System metrics
          schema:
            $ref: '#/definitions/handlers.SystemMetrics'
      summary: System metrics
      tags:
      - metrics
  /proxies:
    get:
      description: Get paginated list of proxies with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by protocol
        in: query
        name: protocol
        type: string
      - description: Filter by country (ISO 3166-1 alpha-2)
        in: query
        name: country_code
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: Sort order (asc/desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of proxies
          schema:
            $ref: '#/definitions/models.ProxyListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: List proxies
      tags:
      - proxies
    post:
      consumes:
      - application/json
      description: Create a new proxy server
      parameters:
      - description: Proxy details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateProxyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created proxy
          schema:
            $ref: '#/definitions/models.Proxy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Create proxy
      tags:
      - proxies
  /proxies/{id}:
    delete:
      description: Delete a proxy server by ID
      parameters:
      - description: Proxy ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Successfully deleted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Delete proxy
      tags:
      - proxies
    put:
      consumes:
      - application/json
      description: Update an existing proxy server
      parameters:
      - description: Proxy ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated proxy details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProxyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated proxy
          schema:
            $ref: '#/definitions/models.Proxy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Update proxy
      tags:
      - proxies
  /proxies/{id}/test:
    post:
      description: Test a proxy server's connectivity and performance
      parameters:
      - description: Proxy ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Test results
          schema:
            $ref: '#/definitions/models.ProxyTestResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Test proxy
      tags:
      - proxies
  /proxies/bulk:
    post:
      consumes:
      - application/json
      description: Create multiple proxy servers at once
      parameters:
      - description: List of proxies to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BulkCreateProxyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Creation results
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Bulk create proxies
      tags:
      - proxies
  /proxies/bulk-delete:
    post:
      consumes:
      - application/json
      description: Delete multiple proxy servers at once
      parameters:
      - description: List of proxy IDs to delete
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BulkDeleteProxyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Deletion results
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Bulk delete proxies
      tags:
      - proxies
  /proxies/bulk-tags:
    post:
      consumes:
      - application/json
      description: Add and/or remove tags on multiple proxies at once
      parameters:
      - description: Proxy IDs and tags to add/remove
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BulkTagProxyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Update results
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Bulk update proxy tags
      tags:
      - proxies
  /proxies/cleanup/force:
    post:
      description: Enqueue async batched deletion of all failed proxies
      produces:
      - application/json
      responses:
        "200":
          description: Job already running, or nothing to clean
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Job accepted
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Health check queue is full
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Force cleanup failed proxies
      tags:
      - proxies
  /proxies/cleanup/run:
    post:
      description: Synchronously delete dead proxies per cleanup settings
      produces:
      - application/json
      responses:
        "200":
          description: Cleanup result
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Run proxy cleanup now
      tags:
      - proxies
  /proxies/export:
    get:
      description: Export proxy list in various formats (txt, json, csv)
      parameters:
      - default: txt
        description: Export format (txt/json/csv)
        in: query
        name: format
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - text/plain
      - application/json
      - text/csv
      responses:
        "200":
          description: Exported file
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Export proxies
      tags:
      - proxies
  /proxies/reload:
    post:
